# nginx server block for a VPS or container host. Adjust root and certificate paths.
server {
  listen 80;
  listen [::]:80;
  server_name oslolights.com www.oslolights.com;
  return 301 https://oslolights.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name oslolights.com;
  root /var/www/oslolights-site;
  index index.html;

  # ssl_certificate     /etc/letsencrypt/live/oslolights.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/oslolights.com/privkey.pem;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  include mime.types;
  types { image/avif avif; application/manifest+json webmanifest; }
  gzip on;
  gzip_types text/css image/svg+xml application/manifest+json application/xml text/plain;

  error_page 404 /404.html;
  location / { try_files $uri $uri/ =404; }
  location ~ ^/(README\.md|_headers|_redirects|vercel\.json|CNAME|scripts/|deploy/|\.) { return 404; }
  location ~* \.(avif|webp|jpg|png|woff2|ico)$ {
    # add_header in a location replaces the server-level ones, so repeat the key one
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
}
